# 本地联调：一个 Postgres 进程内两个库 ——
#   aegis_go：foundation-data + store-ops 共用
#   aegis_python：traffic-sense + ai-assistant 共用
# 首次初始化时由 database/docker-init 创建第二套库。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev
      POSTGRES_DB: aegis_go
    ports:
      - "5432:5432"
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_go"]
      interval: 5s
      timeout: 5s
      retries: 5

  traffic-sense:
    build:
      context: .
      dockerfile: services/traffic-sense/Dockerfile
    environment:
      - ENV=development
      - PYTHON_DATABASE_URL=postgresql+asyncpg://aegis:aegis_dev@postgres:5432/aegis_python
    ports:
      - "8083:8083"
    volumes:
      - ./services/traffic-sense:/app  # 挂载代码目录
    command: ["uvicorn", "traffic_sense.main:app", "--host", "0.0.0.0", "--port", "8083", "--reload"]  # 添加热重载
    depends_on:
      postgres:
        condition: service_healthy  # 等待数据库就绪
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]  # 使用 wget 替代 curl
      interval: 10s
      timeout: 5s
      retries: 3

