# 本地联调：一个 Postgres 进程内两个库 ——
#   aegis_go：foundation-data + store-ops 共用
#   aegis_python：traffic-sense + ai-assistant 共用
# 首次初始化时由 database/docker-init 创建第二套库。
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_go}
    ports:
      - "5432:5432"
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis_go"]
      interval: 5s
      timeout: 5s
      retries: 5

  traffic-sense:
    build:
      context: .
      dockerfile: services/traffic-sense/Dockerfile
    env_file: .env
    environment:
      - ENV=${ENV:-production}
      - PYTHON_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_dev}@postgres:5432/aegis_python
      - GO_STORE_BUSINESS_ADDR=${GO_STORE_BUSINESS_ADDR:-store-ops:50055}
    ports:
      - "8083:8083"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy  # 等待数据库就绪
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8083/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-assistant:
    build:
      context: .
      dockerfile: services/ai-assistant/Dockerfile
    env_file: .env
    environment:
      - ENV=${ENV:-production}
      - PYTHON_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_dev}@postgres:5432/aegis_python
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - GO_BASIC_DATA_ADDR=${GO_BASIC_DATA_ADDR:-basic-data-center:50054}
      - GO_STORE_BUSINESS_ADDR=${GO_STORE_BUSINESS_ADDR:-store-ops:50055}
    ports:
      - "8084:8084"
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  aegis_pg_data:
