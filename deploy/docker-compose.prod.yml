services:
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    environment:
      FOUNDATION_DATA_BASE_URL: http://foundation-data:8081
      STORE_OPS_BASE_URL: http://store-ops:8082
      TRAFFIC_SENSE_BASE_URL: http://traffic-sense:8083
      TRAFFIC_SENSE_WS_BASE_URL: ws://traffic-sense:8083
      AI_ASSISTANT_BASE_URL: http://ai-assistant:8084
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://47.99.126.89}
    depends_on:
      foundation-data:
        condition: service_healthy
      store-ops:
        condition: service_healthy
      traffic-sense:
        condition: service_healthy
      ai-assistant:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/apps/web-hq/dist:/usr/share/nginx/html/hq:ro
      - ./frontend/apps/web-store/dist:/usr/share/nginx/html/store:ro
    depends_on:
      - gateway
    restart: unless-stopped
